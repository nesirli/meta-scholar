services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-metascholar}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-metascholar}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      APP_USERNAME: ${APP_USERNAME:-admin}
      APP_PASSWORD: ${APP_PASSWORD:-password}
      ROOT_PATH: ${ROOT_PATH:-}
    volumes:
      # Corpus fetched via `make get_data` lands here; persist it across restarts.
      - appdata:/app/data
    depends_on:
      postgres:
        condition: service_started
    labels:
      # Coolify omits the backend port for compose services, so Traefik has no
      # server -> 503 "no available server". This label is additive (Coolify
      # never sets a port itself), so it reliably applies.
      - traefik.http.services.https-0-ac2wi6zuhzap79x4e08j4akv-app.loadbalancer.server.port=8501
      # Streamlit serves under baseUrlPath=/portfolio/metascholar, so the proxy
      # must NOT strip the prefix. Traefik's stripprefix is controlled by
      # Coolify's "Strip Prefixes" toggle (turn it OFF) -- it can't be overridden
      # via labels because Coolify regenerates them (see coolify issue #2603).
      # If the server runs Caddy instead, these forward to 8501 without stripping
      # (`handle`, not `handle_path`).
      - 'caddy_0.handle=/portfolio/metascholar*'
      - 'caddy_0.handle.0_reverse_proxy={{upstreams 8501}}'

volumes:
  pgdata:
  appdata:
