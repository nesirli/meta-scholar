[project]
name = "metascholar"
version = "0.1.0"
description = "RAG-based question answering over the metagenomics literature"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.137.1",
    "httpx>=0.28.1",
    "openai>=2.52.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.1",
    "streamlit>=1.59.2",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metascholar"]
