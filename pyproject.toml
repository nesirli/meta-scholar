[project]
name = "metascholar"
version = "0.1.0"
description = "RAG-based question answering over the metagenomics literature"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.52.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "streamlit>=1.60.0",
    "pytest>=9.1.1",
    "httpx>=0.28.1",
    "tqdm>=4.68.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metascholar"]
